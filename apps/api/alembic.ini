# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: the database URL comes from the application
# settings in env.py, so it is never duplicated here and never committed.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filenames are prefixed with a zero-padded counter rather than a timestamp,
# so the directory reads in order.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
