name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    # Deliberately does not enumerate the steps. The previous name listed three of them
    # and went stale as soon as the migration steps were added; the real list is one click
    # away and cannot disagree with itself.
    name: API checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncaai
          POSTGRES_PASSWORD: syncaai
          POSTGRES_DB: syncaai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncaai -d syncaai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://syncaai:syncaai@localhost:5432/syncaai_test
      # Required with no default (ADR-0015). A throwaway value: it signs nothing that
      # leaves the job.
      JWT_SECRET: a-secret-only-for-continuous-integration

    steps:
      - uses: actions/checkout@v7

      # Same reason as .nvmrc in the web job: one place holds the version, so a machine and
      # a workflow cannot quietly disagree about it.
      - uses: actions/setup-python@v7
        with:
          python-version-file: apps/api/.python-version
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify the models and the migrations agree
        # Without this, changing a model and forgetting the migration passes CI: the tests
        # that never touch the new column cannot tell. The drift is only discovered
        # sprints later, with conflicting migrations to untangle.
        run: alembic check

      - name: Verify the migration reverses cleanly
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Test
        # The floor guards against regression; it is not a target. Raise it deliberately
        # in S10 once a number has been chosen and justified.
        run: pytest --cov=syncaai --cov-report=term-missing --cov-fail-under=85

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      # The version comes from .nvmrc rather than from a literal here. Written twice, the
      # two copies drift and nothing notices: this repository ran CI on 22 while the
      # development machine sat on 20, and the whole web suite failed to start there for
      # weeks without a single red build.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # ci, not install: it installs exactly what the lockfile says and fails if
      # package.json and the lockfile disagree, which is the whole point of having one.
      - name: Install
        run: npm ci

      # Runs the storage ban from ADR-0021. A credential written to localStorage fails
      # here rather than in review.
      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Catches what tsc and vitest do not: a broken import path, a plugin that cannot
      # resolve, a config that only works in dev.
      - name: Build
        run: npm run build

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          # The default shallow clone cannot see the base branch, so there is nothing to
          # compare the branch against.
          fetch-depth: 0

      - name: Subjects fit in 72 characters
        # CONTRIBUTING asks for it and six of the first forty-four commits broke it, all
        # written by someone who had read the rule. A convention only holds if something
        # checks it. GitHub truncates the subject at exactly this width, which is why the
        # limit is not arbitrary.
        run: |
          # --no-merges skips the synthetic merge commit that actions/checkout builds
          # for a pull request. Its subject is "Merge <sha> into <sha>", always over the
          # limit, and nobody wrote it.
          long=$(git log --no-merges --format='%s' origin/${{ github.base_ref }}..HEAD | awk 'length($0) > 72')
          if [ -n "$long" ]; then
            echo "These subjects exceed 72 characters:"
            echo "$long" | while read -r subject; do
              echo "  ${#subject}  $subject"
            done
            exit 1
          fi
          echo "All subjects fit."
