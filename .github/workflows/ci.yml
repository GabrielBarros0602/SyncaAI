name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, type check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncaai
          POSTGRES_PASSWORD: syncaai
          POSTGRES_DB: syncaai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncaai -d syncaai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://syncaai:syncaai@localhost:5432/syncaai_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest --cov=syncaai --cov-report=term-missing
