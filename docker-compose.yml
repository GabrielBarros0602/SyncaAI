services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Required-variable syntax: compose refuses to start with a readable message
      # instead of silently interpolating an empty string when .env is missing.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the root .env}
    ports:
      # 5433 on the host: 5432 is commonly already taken by a local PostgreSQL.
      # The api reaches the database as db:5432 over the compose network, so this
      # only affects tools connecting from the host.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes to a single $, so these are read from the container's own
      # environment rather than interpolated by compose at parse time.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Overrides the host-facing value in .env: inside the compose network the database
      # answers to db:5432. Compose gives environment precedence over env_file.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      # Bind mount for local development so uvicorn --reload sees changes.
      - ./apps/api:/app
    command:
      ["uvicorn", "syncaai.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
